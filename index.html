<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trainingslog</title>
<meta name="theme-color" content="#14202A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8ECEF; --surface:#F8FAFB; --sunk:#DCE3E8; --ink:#14202A; --ink2:#4B5A67; --line:#C2CCD5;
  --accent:#1B4FCF; --on-accent:#FFFFFF; --up:#17703F; --hold:#7D5200; --down:#B3261E; --plate:#A3B0BB;
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11171D; --surface:#1A222A; --sunk:#25303A; --ink:#E6ECF1; --ink2:#9DACB9; --line:#34424F;
    --accent:#86A8FF; --on-accent:#0A1222; --up:#5FCB92; --hold:#E2B14F; --down:#FF8E84; --plate:#4B5B69;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11171D; --surface:#1A222A; --sunk:#25303A; --ink:#E6ECF1; --ink2:#9DACB9; --line:#34424F;
  --accent:#86A8FF; --on-accent:#0A1222; --up:#5FCB92; --hold:#E2B14F; --down:#FF8E84; --plate:#4B5B69;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.45 var(--body);-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.1;margin:0;letter-spacing:.005em}
h1{font-size:34px}
h2{font-size:26px;margin-bottom:10px}
h3{font-size:23px}
p{margin:0 0 8px}
a{color:var(--accent)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{padding:20px 0 14px}
.top p{color:var(--ink2);margin:2px 0 0}

main{padding-bottom:170px}
section{margin:0 0 28px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px}
.muted{color:var(--ink2)}
.state{background:var(--sunk);border-radius:6px;padding:14px 16px}
.msg{border-left:4px solid var(--down);background:var(--surface);padding:10px 14px;margin:0 0 16px;border-radius:0 6px 6px 0}
.msg.ok{border-left-color:var(--up)}

.btn{display:inline-block;font:600 18px/1 var(--body);background:var(--accent);color:var(--on-accent);border:0;border-radius:6px;padding:15px 20px;text-decoration:none;cursor:pointer;min-height:48px}
.btn.wide{display:block;width:100%;text-align:center}
.btn.quiet{background:transparent;color:var(--accent);border:1px solid var(--line);font-weight:500}
.btn.small{font-size:16px;padding:10px 14px;min-height:40px}
.btn.danger{background:var(--down);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

input,select,textarea{font:500 18px/1.2 var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;min-height:46px;width:100%}
textarea{font-size:16px;line-height:1.4;min-height:150px;resize:vertical}
input.need{border-color:var(--down);outline:2px solid var(--down)}
label.field{display:block;margin:0 0 12px}
label.field span{display:block;font-size:15px;color:var(--ink2);margin-bottom:4px}

/* Übersicht */
.next{background:var(--ink);color:var(--bg);border-radius:6px;padding:20px 18px}
.next h2{font-size:44px;margin:0 0 4px}
.next p{margin:0 0 16px;opacity:.85}
.next .btn{background:var(--bg);color:var(--ink)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:0 0 8px}
.day{text-align:center;font-size:14px;color:var(--ink2)}
.day i{display:block;height:34px;border-radius:4px;background:var(--sunk);margin-bottom:4px}
.day.on i{background:var(--accent)}
.day.today i{box-shadow:inset 0 0 0 2px var(--ink)}
.big{font:700 44px/1 var(--display)}
.big small{font:500 20px/1 var(--display);color:var(--ink2);margin-left:4px}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--ink2);font-size:15px;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n{white-space:nowrap;font-variant-numeric:tabular-nums}
td input{min-height:38px;padding:6px 8px;width:76px;font-size:16px}
.tag{font-weight:600;white-space:nowrap}
.tag.up{color:var(--up)} .tag.hold{color:var(--hold)} .tag.down{color:var(--down)} .tag.none{color:var(--ink2)}

/* Training */
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;font:600 17px/1 var(--body);padding:13px 8px;border:0;background:transparent;color:var(--ink2);cursor:pointer;min-height:46px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.setup{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end;margin-bottom:18px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 16px 14px;margin:0 0 14px}
.exhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.exhead .goal{color:var(--ink2);font-size:15px;margin:4px 0 0}
.target{font:700 46px/0.9 var(--display);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.target small{font:500 18px/1 var(--display);color:var(--ink2);margin-left:3px}
.target.find{font-size:20px;line-height:1.1;white-space:normal;color:var(--hold);max-width:96px}
.hint{font-size:15px;margin:10px 0 12px;padding-left:10px;border-left:3px solid var(--line)}
.hint.up{border-color:var(--up)} .hint.hold{border-color:var(--hold)} .hint.down{border-color:var(--down)} .hint.find{border-color:var(--hold)}
.stack{position:relative;padding-left:14px}
.stack::before{content:"";position:absolute;left:4px;top:0;bottom:0;width:3px;border-radius:2px;background:var(--line)}
.cols,.set{display:grid;grid-template-columns:42px minmax(0,1fr) minmax(0,1fr) 84px;gap:8px;align-items:center}
.cols{font-size:14px;color:var(--ink2);margin-bottom:4px}
.set{margin-bottom:6px;position:relative}
.plate{display:flex;align-items:center;justify-content:center;height:46px;border-radius:3px;background:var(--plate);color:var(--surface);font:700 22px/1 var(--display)}
.set.done .plate{background:var(--accent);color:var(--on-accent)}
.set.now::before{content:"";position:absolute;left:-17px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--ink);border:3px solid var(--surface)}
.tick{font:600 16px/1 var(--body);height:46px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.tick[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pair{font-size:15px;color:var(--ink2);margin:8px 0 0}

/* Timer */
#timer{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--ink);color:var(--bg)}
#timer .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:8px;padding-bottom:8px}
#timer .clock{font:700 34px/1 var(--display);font-variant-numeric:tabular-nums;margin-right:10px}
#timer button{font:600 16px/1 var(--body);background:transparent;color:var(--bg);border:1px solid currentColor;border-radius:6px;padding:10px 12px;cursor:pointer;min-height:40px}
#timer.over{background:var(--up);color:#fff}
#toast{position:fixed;left:16px;right:16px;bottom:calc(126px + env(safe-area-inset-bottom,0px));z-index:7;max-width:608px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:6px;font-weight:500}

/* Navigation */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:flex;padding:0 4px}
.tabs a{flex:1;text-align:center;text-decoration:none;color:var(--ink2);font:600 16px/1 var(--display);padding:20px 1px 18px;border-top:3px solid transparent;margin-top:-1px}
.tabs a[aria-current="page"]{color:var(--ink);border-top-color:var(--accent)}

/* Verlauf, Körper */
.chart{width:100%;height:auto;display:block}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart circle{fill:var(--surface);stroke:var(--accent);stroke-width:2.5}
.chart text{fill:var(--ink2);font:500 11px var(--body)}
.sess{border-top:1px solid var(--line);padding:14px 0}
.sess:first-of-type{border-top:0}
.sess h3{margin-bottom:6px}
.sess ul{list-style:none;margin:0 0 10px;padding:0;font-size:16px}
.sess li{padding:2px 0}
.sess li b{font-weight:600}
.entries{list-style:none;margin:0;padding:0}
.entries li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.entries li:first-child{border-top:0}
.notes h3{margin:16px 0 4px}
.meter{height:12px;border-radius:3px;background:var(--sunk);overflow:hidden;margin:6px 0 4px}
.meter i{display:block;height:100%;background:var(--accent)}
.meter.over i{background:var(--down)}
.left{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.left .big{font-size:40px}
.left p{margin:0}
.grid3{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);gap:8px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{font:500 15px/1.2 var(--body);background:var(--sunk);color:var(--ink);border:0;border-radius:20px;padding:9px 13px;cursor:pointer;text-align:left}
.food{list-style:none;margin:0;padding:0}
.food li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.food li:first-child{border-top:0}
.food .nm{font-weight:500}
.food .vals{color:var(--ink2);font-size:15px;font-variant-numeric:tabular-nums}
details{border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 16px}
summary{cursor:pointer;font-weight:600;padding:14px 0}
details[open]{padding-bottom:16px}
button:disabled{opacity:.55;cursor:default}
@media (min-width:560px){ .next h2{font-size:54px} }
@media (prefers-reduced-motion:no-preference){ .set.done .plate{transition:background-color .15s} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Trainingslog</h1>
    <p id="datum"></p>
  </header>
  <main id="view"><p class="state">Daten werden geladen.</p></main>
</div>
<div id="toast" role="status" hidden></div>
<div id="timer" role="timer" hidden>
  <div class="wrap">
    <div><span class="clock" id="clock">0:00</span><span id="timerlabel"></span></div>
    <button type="button" data-action="timerstop">Pause beenden</button>
  </div>
</div>
<nav class="tabs" aria-label="Bereiche">
  <div class="wrap" id="tabs"></div>
</nav>

<script>
(function(){
'use strict';

var TABS = [['uebersicht','Heute'],['training','Training'],['essen','Essen'],['verlauf','Verlauf'],['koerper','Körper'],['plan','Plan']];
var view = document.getElementById('view');
var S = {
  status:'loading', plan:null, body:[], sessions:[], draft:null, draftTouched:false, skipDraft:false,
  tab:'uebersicht', backup:null, profile:null, food:{}, foodDate:null, keep:{}, ai:{busy:null, note:'', sug:null, sugNote:''}, exSel:null, confirm:null, msg:null, saved:null, copyNote:'', sig:'', pending:false, timer:null
};
var col = null, slowT = null;

/* ---------- Helfer ---------- */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function num(v){ if (v == null) return null; var t = String(v).trim().replace(',', '.'); if (t === '') return null; var n = Number(t); return (isFinite(n) && n >= 0) ? n : null; }
function fmt(n){ return n == null ? '' : String(Math.round(n * 100) / 100).replace('.', ','); }
function ymd(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function today(){ return ymd(new Date()); }
function dmy(s){ var p = String(s).split('-'); return p.length === 3 ? p[2] + '.' + p[1] + '.' + p[0] : String(s); }
function ms(s){ var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]).getTime(); }
function clone(x){ return JSON.parse(JSON.stringify(x)); }
function sleep(t){ return new Promise(function(r){ setTimeout(r, t); }); }

/* ---------- Plan und Auswertung ---------- */
function order(){ return (S.plan && S.plan.order && S.plan.order.length) ? S.plan.order : Object.keys((S.plan && S.plan.units) || {}); }
function unitItems(type){ var u = S.plan && S.plan.units && S.plan.units[type]; return (u && u.items) || []; }
function allItems(){ var seen = {}, out = []; order().forEach(function(t){ unitItems(t).forEach(function(it){ if (!seen[it.id]) { seen[it.id] = 1; out.push(it); } }); }); return out; }
function nextType(){ var o = order(); if (!o.length) return null; var last = S.sessions[0]; if (!last) return o[0]; var i = o.indexOf(last.type); return o[(i + 1) % o.length]; }
function logsFor(id){
  var out = [];
  S.sessions.forEach(function(s){ (s.items || []).forEach(function(it){
    if (it.id !== id) return;
    var sets = (it.sets || []).filter(function(x){ return typeof x.kg === 'number' && typeof x.reps === 'number'; });
    if (sets.length) out.push({date:s.date, sets:sets});
  }); });
  return out;
}
function repsText(log){ return log.sets.map(function(x){ return x.reps; }).join(', '); }
function total(log){ return log.sets.reduce(function(a, x){ return a + x.reps; }, 0); }
function best(log){ return Math.max.apply(null, log.sets.map(function(x){ return x.kg * (1 + x.reps / 30); })); }
function stalled(id){
  var l = logsFor(id); if (l.length < 4) return false;
  var base = l[3], kg = base.sets[0].kg;
  for (var i = 0; i < 3; i++) { if (l[i].sets[0].kg > kg || (l[i].sets[0].kg === kg && total(l[i]) > total(base))) return false; }
  return true;
}
function advise(it){
  var step = (typeof it.step === 'number' && it.step > 0) ? it.step : 2.5;
  var logs = logsFor(it.id);
  if (!logs.length) {
    if (typeof it.start === 'number') return {kg:it.start, kind:'hold', text:'Start mit dem Gewicht aus deinem letzten Training. Ziel: ' + it.sets + ' × ' + it.repMax + ', erst dann mehr Gewicht.'};
    return {kg:null, kind:'find', text:'Gewicht heute ermitteln: zwei leichte Aufwärmsätze, dann steigern, bis du ' + it.repMax + ' Wiederholungen schaffst und noch etwa 2 übrig hättest.'};
  }
  var last = logs[0], kg = last.sets[0].kg, pre = 'Letztes Mal ' + fmt(kg) + ' kg: ' + repsText(last) + '. ';
  if (stalled(it.id)) return {kg:kg, kind:'down', text:pre + 'Seit 3 Einheiten kein Fortschritt. Sag das Claude im Chat, dann gibt es eine Änderung.'};
  var full = last.sets.length >= it.sets && last.sets.slice(0, it.sets).every(function(x){ return x.reps >= it.repMax && x.kg >= kg; });
  if (full) return {kg:kg + step, kind:'up', text:pre + 'Alle Sätze oben, heute eine Stufe mehr.'};
  if (last.sets[0].reps < it.repMin) return {kg:Math.max(kg - step, 0), kind:'down', text:pre + 'Unter der Spanne, heute eine Stufe leichter.'};
  return {kg:kg, kind:'hold', text:pre + 'Gewicht bleibt, Ziel: mehr Wiederholungen.'};
}
function standing(id){
  var l = logsFor(id);
  if (!l.length) return {k:'none', t:'Offen'};
  if (stalled(id)) return {k:'down', t:'Stagniert'};
  if (l.length === 1) return {k:'hold', t:'Erster Eintrag'};
  var a = best(l[0]), b = best(l[1]);
  if (a > b + 0.01) return {k:'up', t:'Gestiegen'};
  if (a < b - 0.01) return {k:'down', t:'Gefallen'};
  return {k:'hold', t:'Gleich'};
}
function bodyRate(){
  var e = S.body; if (e.length < 2) return null;
  var lastT = ms(e[e.length - 1].date);
  var pts = e.filter(function(x){ return lastT - ms(x.date) <= 28 * 864e5; }).map(function(x){ return {x:ms(x.date) / 864e5, y:x.kg}; });
  if (pts.length < 2 || pts[pts.length - 1].x - pts[0].x < 6) return null;
  var n = pts.length, sx = 0, sy = 0, sxx = 0, sxy = 0;
  pts.forEach(function(p){ sx += p.x; sy += p.y; sxx += p.x * p.x; sxy += p.x * p.y; });
  var den = n * sxx - sx * sx; if (!den) return null;
  return (n * sxy - sx * sy) / den * 7;
}
function rateVerdict(r){
  if (r == null) return {k:'none', t:'Dein Tempo erscheint hier nach zwei Einträgen mit einer Woche Abstand.'};
  var s = (r > 0 ? '+' : '') + fmt(Math.round(r * 100) / 100) + ' kg pro Woche. ';
  if (r > -0.25) return {k:'hold', t:s + 'Langsamer als geplant. Bleibt das zwei Wochen so, die Portionen etwas verkleinern.'};
  if (r >= -0.6) return {k:'up', t:s + 'Im Zielbereich von 0,3 bis 0,5 kg weniger pro Woche.'};
  if (r >= -0.75) return {k:'up', t:s + 'Etwas schneller als geplant, noch in Ordnung.'};
  return {k:'down', t:s + 'Schneller als geplant. Etwas mehr essen, sonst leidet der Muskelaufbau.'};
}
function sessionText(s){
  var lines = ['Einheit ' + s.type + ', ' + dmy(s.date)];
  (s.items || []).forEach(function(it){
    if (!it.sets || !it.sets.length) return;
    var same = it.sets.every(function(x){ return x.kg === it.sets[0].kg; });
    lines.push(same ? it.name + ' ' + fmt(it.sets[0].kg) + ' kg: ' + it.sets.map(function(x){ return x.reps; }).join(', ')
                    : it.name + ': ' + it.sets.map(function(x){ return fmt(x.kg) + ' kg x ' + x.reps; }).join(', '));
  });
  return lines.join('\n');
}

/* ---------- Entwurf der laufenden Einheit ---------- */
function getDraft(){
  var o = order();
  if (!S.draft || typeof S.draft !== 'object') S.draft = {type:nextType(), date:today(), sets:{}};
  if (!S.draft.sets) S.draft.sets = {};
  if (o.indexOf(S.draft.type) < 0) S.draft.type = nextType();
  if (!S.draft.date) S.draft.date = today();
  return S.draft;
}
function rowsFor(d, it){
  var r = d.sets[it.id];
  if (!r) { var a = advise(it); r = d.sets[it.id] = []; for (var i = 0; i < it.sets; i++) r.push({kg:a.kg != null ? fmt(a.kg) : '', reps:'', done:false}); }
  while (r.length < it.sets) r.push({kg:r[0] ? r[0].kg : '', reps:'', done:false});
  return r;
}
function draftHasEntries(){
  if (!S.draft || !S.draft.sets) return false;
  return Object.keys(S.draft.sets).some(function(k){ return S.draft.sets[k].some(function(r){ return String(r.reps || '').trim() !== ''; }); });
}
var draftT = null, draftBusy = false, draftAgain = false;
function touchDraft(){ S.draftTouched = true; clearTimeout(draftT); draftT = setTimeout(flushDraft, 1500); }
function flushDraft(){
  if (!col || !S.draft) return;
  if (draftBusy) { draftAgain = true; return; }
  draftBusy = true;
  col.doc('draft').set(clone(S.draft)).catch(function(){}).then(function(){
    draftBusy = false;
    if (draftAgain) { draftAgain = false; flushDraft(); }
  });
}

/* ---------- Schreiben ---------- */
function write(fn){
  return fn().catch(function(err){
    if (err && err.code === 'unavailable') return sleep(600 + Math.random() * 600).then(fn);
    throw err;
  }).then(function(){ return true; }, function(err){
    var c = err && err.code;
    S.msg = {kind:'err', text: c === 'quota_exceeded' ? 'Der Speicher des Geräts ist voll. Lösche alte Einheiten im Verlauf und speichere erneut.'
      : 'Speichern hat nicht geklappt. Prüfe die Verbindung und speichere erneut.'};
    render(); return false;
  });
}
function saveSession(){
  var d = getDraft(), items = [], missing = null;
  unitItems(d.type).forEach(function(it){
    var rows = (d.sets[it.id] || []).map(function(r){ return {kg:num(r.kg), reps:num(r.reps)}; }).filter(function(r){ return r.reps != null && r.reps >= 1; });
    if (!rows.length) return;
    if (rows.some(function(r){ return r.kg == null; })) { if (!missing) missing = it.name; return; }
    items.push({id:it.id, name:it.name, repMin:it.repMin, repMax:it.repMax, planned:it.sets,
      sets:rows.map(function(r){ return {kg:r.kg, reps:Math.round(r.reps)}; })});
  });
  if (missing) { S.msg = {kind:'err', text:'Bei „' + missing + '“ fehlt das Gewicht. Trag es ein und speichere erneut.'}; render(); window.scrollTo(0, 0); return; }
  if (!items.length) { S.msg = {kind:'err', text:'Noch kein Satz eingetragen. Trag bei mindestens einer Übung die Wiederholungen ein.'}; render(); window.scrollTo(0, 0); return; }
  var now = new Date();
  var id = 's-' + ymd(now).replace(/-/g, '') + 'T' + String(now.getHours()).padStart(2, '0') + String(now.getMinutes()).padStart(2, '0') + String(now.getSeconds()).padStart(2, '0');
  var doc = {kind:'session', type:d.type, date:d.date, savedAt:now.toISOString(), items:items};
  clearTimeout(draftT);
  var wait = function(){ return draftBusy ? sleep(100).then(wait) : Promise.resolve(); };
  wait().then(function(){
    return write(function(){ return col.doc(id).set(doc); });
  }).then(function(ok){
    if (!ok) return;
    S.saved = doc; S.draft = null; S.draftTouched = false; S.skipDraft = true; S.msg = null; S.copyNote = ''; stopTimer();
    render(); window.scrollTo(0, 0);
    write(function(){ return col.doc('draft').delete(); });
  });
}
function saveBody(entries){ entries.sort(function(a, b){ return a.date < b.date ? -1 : 1; }); return write(function(){ return col.doc('body').set({kind:'body', entries:entries}); }); }

/* ---------- Pausentimer ---------- */
var tickT = null;
function startTimer(sec, label){
  S.timer = {end:Date.now() + sec * 1000, label:label, over:false};
  clearInterval(tickT); tickT = setInterval(paintTimer, 250); paintTimer();
}
function stopTimer(){ S.timer = null; clearInterval(tickT); paintTimer(); }
function paintTimer(){
  var el = document.getElementById('timer');
  if (!S.timer) { el.hidden = true; return; }
  var left = Math.ceil((S.timer.end - Date.now()) / 1000);
  el.hidden = false;
  if (left <= 0) {
    if (!S.timer.over) { S.timer.over = true; try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {} }
    el.classList.add('over');
    document.getElementById('clock').textContent = '0:00';
    document.getElementById('timerlabel').textContent = 'Pause vorbei, nächster Satz';
    if (left < -20) stopTimer();
    return;
  }
  el.classList.remove('over');
  document.getElementById('clock').textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
  document.getElementById('timerlabel').textContent = S.timer.label;
}
var toastT = null;
function toast(t){ var el = document.getElementById('toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(function(){ el.hidden = true; }, 4000); }

/* ---------- Diagramm ---------- */
function chart(points, label){
  if (!points.length) return '';
  var W = 320, H = 150, l = 40, r = 12, t = 14, b = 24;
  var xs = points.map(function(p){ return p.x; }), ys = points.map(function(p){ return p.y; });
  var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs), lo = Math.min.apply(null, ys), hi = Math.max.apply(null, ys);
  if (x0 === x1) { x0 -= 1; x1 += 1; }
  var y0 = lo, y1 = hi; if (y0 === y1) { y0 -= 1; y1 += 1; }
  var pad = (y1 - y0) * 0.12; y0 -= pad; y1 += pad;
  var X = function(x){ return l + (x - x0) / (x1 - x0) * (W - l - r); }, Y = function(y){ return t + (1 - (y - y0) / (y1 - y0)) * (H - t - b); };
  var path = points.map(function(p, i){ return (i ? 'L' : 'M') + X(p.x).toFixed(1) + ' ' + Y(p.y).toFixed(1); }).join(' ');
  var dots = points.map(function(p){ return '<circle cx="' + X(p.x).toFixed(1) + '" cy="' + Y(p.y).toFixed(1) + '" r="3.5"/>'; }).join('');
  var first = points[0], last = points[points.length - 1];
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(label) + '">' +
    '<line class="ax" x1="' + l + '" y1="' + t + '" x2="' + l + '" y2="' + (H - b) + '"/><line class="ax" x1="' + l + '" y1="' + (H - b) + '" x2="' + (W - r) + '" y2="' + (H - b) + '"/>' +
    '<text x="' + (l - 6) + '" y="' + (Y(hi) + 4).toFixed(1) + '" text-anchor="end">' + fmt(Math.round(hi * 10) / 10) + '</text>' +
    (hi !== lo ? '<text x="' + (l - 6) + '" y="' + (Y(lo) + 4).toFixed(1) + '" text-anchor="end">' + fmt(Math.round(lo * 10) / 10) + '</text>' : '') +
    '<text x="' + l + '" y="' + (H - 7) + '">' + esc(first.label) + '</text>' +
    (points.length > 1 ? '<text x="' + (W - r) + '" y="' + (H - 7) + '" text-anchor="end">' + esc(last.label) + '</text>' : '') +
    (points.length > 1 ? '<path class="ln" d="' + path + '"/>' : '') + dots + '</svg>';
}

/* ---------- Essen ---------- */
var sample = null, sampleOff = false, foodQ = Promise.resolve();
function n0(n){ return Math.round(n).toLocaleString('de-DE'); }
function rid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function ageOf(birth){
  var p = String(birth).split('-'), n = new Date(), a = n.getFullYear() - (+p[0]);
  if (n.getMonth() + 1 < +p[1] || (n.getMonth() + 1 === +p[1] && n.getDate() < +p[2])) a--;
  return a;
}
function targets(){
  var p = S.profile; if (!p || (p.sex !== 'm' && p.sex !== 'w') || !p.height || !p.birth) return null;
  var kg = S.body.length ? S.body[S.body.length - 1].kg : p.weight; if (!kg) return null;
  var bmr = 10 * kg + 6.25 * p.height - 5 * ageOf(p.birth) + (p.sex === 'm' ? 5 : -161);
  var tdee = bmr * (p.activity || 1.4), def = Math.min(Math.max(p.deficit || 0, 0), 600);
  return {kcal:Math.round((tdee - def) / 10) * 10, tdee:Math.round(tdee / 10) * 10, protein:p.protein || Math.round(kg * 1.8), kg:kg};
}
function dayItems(date){ return S.food[date] || []; }
function dayTotals(date){ var k = 0, p = 0; dayItems(date).forEach(function(x){ k += x.kcal || 0; p += x.protein || 0; }); return {kcal:k, protein:p}; }
function saveFood(date, items){
  S.food[date] = items; requestRender();
  foodQ = foodQ.then(function(){ return write(function(){ return col.doc('f-' + date).set({kind:'food', date:date, items:items}); }); });
}
function addFood(date, list){
  var items = dayItems(date).map(function(x){ return {id:x.id, name:x.name, kcal:x.kcal, protein:x.protein, est:!!x.est}; });
  list.forEach(function(x){ items.push({id:rid(), name:String(x.name).slice(0, 90), kcal:Math.round(x.kcal), protein:Math.round(x.protein * 10) / 10, est:!!x.est}); });
  saveFood(date, items);
}
function cleanFood(res){
  if (!Array.isArray(res)) return [];
  return res.filter(function(x){ return x && typeof x.name === 'string' && x.name.trim() && typeof x.kcal === 'number' && x.kcal >= 0 && x.kcal <= 5000 && typeof x.protein === 'number' && x.protein >= 0 && x.protein <= 400; }).slice(0, 20);
}
function aiError(e){
  var c = e && e.code;
  if (c === 'cancelled') return '';
  if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].indexOf(c) >= 0) { sampleOff = true; return 'Die Schätzung ist hier nicht verfügbar. Trag die Werte von Hand ein.'; }
  if (c === 'rate_limited') return 'Zu viele Anfragen. Versuch es später noch einmal.';
  if (c === 'session_expired') return 'Du bist abgemeldet. Melde dich neu an und versuch es noch einmal.';
  if (c === 'refused' || c === 'empty_completion' || c === 'invalid_json') return 'Das hat nicht geklappt. Formuliere es anders oder trag die Werte von Hand ein.';
  return 'Verbindung unterbrochen. Versuch es noch einmal.';
}
function frequent(){
  var m = {};
  Object.keys(S.food).forEach(function(d){ S.food[d].forEach(function(x){ var k = x.name.toLowerCase(); if (!m[k]) m[k] = {n:0, x:x}; m[k].n++; m[k].x = x; }); });
  return Object.keys(m).map(function(k){ return m[k]; }).sort(function(a, b){ return b.n - a.n; }).slice(0, 6).map(function(o){ return o.x; });
}
function meter(label, have, goal, unit){
  var pct = goal ? Math.min(100, have / goal * 100) : 0, over = goal && have > goal;
  return '<div><p><b>' + label + '</b> ' + n0(have) + ' von ' + n0(goal) + ' ' + unit + '</p><div class="meter' + (over ? ' over' : '') + '" role="img" aria-label="' + label + ': ' + Math.round(pct) + ' Prozent des Ziels"><i style="width:' + pct.toFixed(1) + '%"></i></div></div>';
}
function leftBox(date, t){
  var d = dayTotals(date), rk = t.kcal - d.kcal, rp = t.protein - d.protein;
  return '<div class="left"><p><span class="big">' + n0(Math.abs(rk)) + '</span><br>' + (rk >= 0 ? 'kcal übrig' : 'kcal über dem Ziel') + '</p>' +
    '<p><span class="big">' + n0(Math.max(rp, 0)) + '</span><br>' + (rp > 0 ? 'g Eiweiß fehlen' : 'g offen, Eiweißziel erreicht') + '</p></div>';
}

      : '<button class="btn small quiet" type="button" data-action="ask" data-id="draft">Einheit verwerfen</button>') + '</div>';
  }

}

function typing(){ var a = document.activeElement; return !!(a && view.contains(a) && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)); }

function copy(text, done){
  var fail = function(){ done('Kopieren ist hier gesperrt. Markiere den Text und kopiere ihn von Hand.'); };

}
var actions = {

      var prow = partner ? rowsFor(d, partner)[i] : null;

  estimate:function(){

    sample.json(prompt, {modelTier:'quick'}).then(function(res){
      var list = cleanFood(res); S.ai.busy = null;

      'Uhrzeit: ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0') + '. Tagesziel: ' + t.kcal + ' kcal, ' + t.protein + ' g Eiweiß. Bisher gegessen: ' + Math.round(d.kcal) + ' kcal, ' + Math.round(d.protein) + ' g Eiweiß. Übrig: ' + Math.round(t.kcal - d.kcal) + ' kcal, ' + Math.round(Math.max(t.protein - d.protein, 0)) + ' g Eiweiß.' + (trained ? ' Heute war Krafttraining.' : '') + '\n' +

      if (!rows[j].done && String(rows[j].reps).trim() === '' && (rows[j].kg === old || rows[j].kg === '')) {
        rows[j].kg = t.value;
        var o = view.querySelector('input[data-f="kg"][data-ex="' + it.id + '"][data-i="' + j + '"]'); if (o) o.value = t.value;
      }
    }
  }
  touchDraft();
});
view.addEventListener('change', function(e){
  var t = e.target;
  if (t.id === 'sessdate') { var d = getDraft(); d.date = t.value || today(); touchDraft(); }
  else if (t.id === 'exsel') { S.exSel = t.value; render(); }
  else if (t.id === 'fooddate') { S.foodDate = t.value || today(); S.ai.sug = null; S.ai.sugNote = ''; S.ai.note = ''; render(); }
  else if (t.dataset && t.dataset.step) {
    var v = num(t.value);
    if (v == null || v <= 0) { S.msg = {kind:'err', text:'Die Stufe muss größer als 0 sein, zum Beispiel 2,5 oder 5.'}; render(); return; }
    S.msg = null;
    var p = clone(S.plan), id = t.dataset.step;
    Object.keys(p.units).forEach(function(k){ (p.units[k].items || []).forEach(function(it){ if (it.id === id) it.step = v; }); });
    write(function(){ return col.doc('plan').set(p); });
  }
});
view.addEventListener('focusout', function(){ setTimeout(function(){ if (S.pending && !typing()) render(); }, 400); });
function route(){
  var h = (location.hash || '').replace('#', '');
  var ok = TABS.some(function(t){ return t[0] === h; });
  var next = ok ? h : 'uebersicht';
  if (next !== S.tab) { S.confirm = null; S.msg = null; if (next !== 'training') S.saved = null; }
  S.tab = next; render(); window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

/* ---------- Lokaler Speicher ---------- */

": 2.5, "rest": 120, "restLabel": "2 min"}, {"id": "seitheben", "name": "Seitheben", "sets": 2, "repMin": 12, "repMax": 20, "start": null, "step": 1, "rest": 75, "restLabel": "60-90 s"}, {"id": "bizeps", "name": "Bizeps-Curl am Seilzug, SZ-Stange", "sets": 3, "repMin": 6, "repMax": 10, "start": 30, "step": 2.5, "rest": 60, "restLabel": "60 s nach beiden", "pair": "arme"}, {"id": "trizeps", "name": "Trizepsdrücken am Seil", "sets": 2, "repMin": 10, "repMax": 15, "start": null, "step": 2.5, "rest": 60, "restLabel": "60 s nach beiden", "pair": "arme"}]}}, "notes": [{"title": "Startgewicht finden", "text": "Zwei leichte Aufwärmsätze, dann steigern, bis du die obere Wiederholungszahl schaffst und noch etwa 2 Wiederholungen übrig hättest. Dieses Gewicht eintragen."}, {"title": "Steigern", "text": "Erst alle Sätze ans obere Ende der Spanne bringen, dann eine Stufe mehr Gewicht. Immer nur eine Sache ändern."}, {"title": "Arme im Wechsel", "text": "Bizeps und Trizeps abwechselnd ohne Pause dazwischen, danach 60 Sekunden Pause. So bleiben die 60 Minuten realistisch."}, {"title": "Wochenrhythmus", "text": "Bei 3 Einheiten: A, B, A und in der Folgewoche B, A, B. Bei 2 Einheiten einfach weiter abwechseln."}]};
function localCol(){
  var KEY = 'trainingslog.v1', data = {}, subs = [];
  try { data = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { return null; }
  if (!data.plan) data.plan = clone(DEFAULT_PLAN);
  function persist(){ try { localStorage.setItem(KEY, JSON.stringify(data)); return true; } catch (e) { return false; } }
  function snap(){ return {docs:Object.keys(data).sort().map(function(id){ var v = data[id]; return {id:id, exists:true, data:function(){ return v; }}; }), metadata:{fromCache:false}}; }
  function emit(){ var x = snap(); subs.forEach(function(f){ f(x); }); }
  return {
    doc:function(id){ return {
      set:function(d){ var old = data[id]; data[id] = clone(d); if (!persist()) { if (old === undefined) delete data[id]; else data[id] = old; return Promise.reject({code:'quota_exceeded'}); } emit(); return Promise.resolve(); },
      delete:function(){ delete data[id]; persist(); emit(); return Promise.resolve(); } }; },
    onSnapshot:function(n){ subs.push(n); setTimeout(function(){ n(snap()); }, 0); return function(){}; },
    all:function(){ return clone(data); },
    merge:function(d){ Object.keys(d).forEach(function(k){ data[k] = d[k]; }); var ok = persist(); emit(); return ok; }
  };
}

/* ---------- Start ---------- */
function onSnap(snap){
  clearTimeout(slowT);
  var plan = null, body = [], sessions = [], draft = null, profile = null, food = {};
  snap.docs.forEach(function(d){
    var x = d.data(); if (!x) return;
    if (d.id === 'plan') plan = x;
    else if (d.id === 'body') body = Array.isArray(x.entries) ? x.entries.filter(function(e){ return e && e.date && typeof e.kg === 'number'; }) : [];
    else if (d.id === 'draft') draft = x;
    else if (d.id === 'profile') profile = x;
    else if (d.id.indexOf('f-') === 0 && x.date && Array.isArray(x.items)) food[x.date] = x.items.filter(function(i){ return i && i.id && typeof i.name === 'string' && typeof i.kcal === 'number'; });
    else if (d.id.indexOf('s-') === 0 && x.date) sessions.push(Object.assign({_id:d.id}, x));
  });
  sessions.sort(function(a, b){ return a.date === b.date ? (a._id < b._id ? 1 : -1) : (a.date < b.date ? 1 : -1); });
  body = body.slice().sort(function(a, b){ return a.date < b.date ? -1 : 1; });
  if (!draft) S.skipDraft = false;
  var useDraft = !S.draftTouched && !S.skipDraft;
  var sig = JSON.stringify([plan, body, sessions, useDraft ? draft : 0, profile, food]);
  var first = S.status !== 'ok';
  S.status = 'ok';
  if (sig === S.sig && !first) return;
  S.sig = sig; S.plan = plan; S.body = body; S.sessions = sessions; S.profile = profile; S.food = food;
  if (useDraft) S.draft = draft ? clone(draft) : null;
  requestRender();
}
function start(){
  document.getElementById('datum').textContent = new Date().toLocaleDateString('de-DE', {weekday:'long', day:'numeric', month:'long'});
  route();
  col = localCol();
  if (!col) { S.status = 'none'; render(); return; }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  col.onSnapshot(onSnap);
  try { if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js'); } catch (e) {}
}
start();
})();
